<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Make an Appointment</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5fafa;
        }

        .appointment-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .appointment-box {
            width: 600px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .appointment-box h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #247e78;
        }

        .appointment-box p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }

        .form-group textarea {
            height: 100px;
            resize: none;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            background: #249e94;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #187c75;
        }

    </style>
</head>

<body>

<section class="appointment-section">

    <div class="appointment-box">

        <h1>Make an Appointment</h1>

        <p>Book your appointment with our doctors</p>


        <form action="/api/appointments" method="post">

            <div class="form-group">
                <label>Name</label>

                <input
                        type="text"
                        name="name"
                        placeholder="Enter your name"
                        required>
            </div>


            <div class="form-group">
                <label>Email</label>

                <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
            </div>


            <div class="form-group">
                <label>Phone</label>

                <input
                        type="text"
                        name="phone"
                        placeholder="Enter your phone number">
            </div>


            <div class="form-group">
                <label>Select Doctor</label>

                <select name="doctor">

                    <option value="">Select Doctor</option>

                    <option value="Dr. Sharma">
                        Dr. Sharma
                    </option>

                    <option value="Dr. Verma">
                        Dr. Verma
                    </option>

                    <option value="Dr. Singh">
                        Dr. Singh
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Appointment Date</label>

                <input
                        type="date"
                        name="appointmentDate"
                        required>

            </div>


            <div class="form-group">

                <label>Message</label>

                <textarea
                        name="message"
                        placeholder="Write your message">
                </textarea>

            </div>


            <button
                    type="submit"
                    class="submit-btn">

                Book Appointment

            </button>

        </form>

    </div>

</section>

</body>

</html>
