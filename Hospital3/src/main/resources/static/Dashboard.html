<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Docmed Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5fafa;
        }

        .header {
            background: #249e94;
            color: white;
            padding: 25px 40px;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #249e94;
            color: white;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: #249e94;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>Docmed Dashboard</h1>

    <p>Appointment Management System</p>

</div>


<div class="container">

    <div class="card">

        <h2>Appointment Submitted Successfully</h2>

        <p style="margin-top: 10px;">
            Your appointment has been saved in the database.
        </p>

        <a href="/appointment.html" class="btn">
            Book Another Appointment
        </a>

    </div>

</div>

</body>

</html>
